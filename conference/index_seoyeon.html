<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Planner CRM</title>
  <style>
:root {
  --bg: #f6f7f4;
  --surface: #ffffff;
  --surface-alt: #f9faf8;
  --border: #dde3dd;
  --text: #1f2a2a;
  --muted: #66716d;
  --primary: #2f6f62;
  --primary-strong: #1f5c52;
  --primary-soft: #e4f0ec;
  --accent: #d66f56;
  --accent-soft: #fae9e4;
  --blue: #4d7891;
  --warning: #b9822f;
  --danger: #bd5d5d;
  --shadow: 0 18px 44px rgba(31, 42, 42, 0.08);
  --radius: 8px;
}

* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
}

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  min-height: 40px;
}

.app-shell {
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  background: #eef2ed;
  border-right: 1px solid var(--border);
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: var(--radius);
  display: grid;
  place-items: center;
  background: var(--primary);
  color: #fff;
  font-weight: 700;
}

.brand h1,
.brand p,
.topbar h2,
.eyebrow,
.section-title h4,
.client-card h4,
.preview-card h4,
.card h4,
p {
  overflow-wrap: anywhere;
}

.brand h1 {
  margin: 0;
  font-size: 1rem;
}

.brand p {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 0.84rem;
}

.nav-menu {
  display: grid;
  gap: 6px;
}

.nav-item {
  width: 100%;
  border: 1px solid transparent;
  background: transparent;
  text-align: left;
  padding: 11px 12px;
  border-radius: var(--radius);
  color: var(--text);
  cursor: pointer;
}

.nav-item:hover,
.nav-item.active {
  background: var(--surface);
  border-color: var(--border);
  color: var(--primary-strong);
  font-weight: 700;
}

.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.68);
  color: var(--muted);
  font-size: 0.88rem;
}

.sidebar-footer p {
  margin: 0 0 4px;
}

.main-panel {
  min-width: 0;
  padding: 24px clamp(16px, 3vw, 34px) 36px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 22px;
}

.topbar h2 {
  margin: 4px 0 0;
  font-size: clamp(1.35rem, 2vw, 1.9rem);
  letter-spacing: 0;
}

.eyebrow {
  margin: 0;
  color: var(--primary);
  text-transform: uppercase;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
}

.topbar-actions,
.calendar-toolbar,
.calendar-view-toggle,
.calendar-nav,
.coordination-actions,
.modal-actions,
.client-meta,
.range-legend {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.primary-btn,
.ghost-btn,
.small-btn,
.tab-btn {
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 9px 12px;
  cursor: pointer;
  white-space: nowrap;
}

.primary-btn {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.primary-btn:hover {
  background: var(--primary-strong);
}

.ghost-btn {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border);
}

.small-btn {
  background: var(--primary-soft);
  color: var(--primary-strong);
  border-color: #cfe0db;
}

.small-btn.active,
.tab-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.page-grid,
.detail-shell,
.item-list,
.form-stack,
.legend-list {
  display: grid;
  gap: 14px;
}

.hero-card,
.card,
.list-card,
.detail-card,
.preview-card,
.stat-box,
.client-card,
.month-card,
.range-picker-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.hero-card,
.card,
.list-card,
.detail-card {
  padding: clamp(16px, 2vw, 22px);
}

.hero-card,
.detail-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  background: linear-gradient(120deg, #ffffff 0%, #eef5f1 100%);
}

.hero-card h3,
.detail-card h3 {
  margin: 0 0 4px;
  font-size: clamp(1.12rem, 1.8vw, 1.55rem);
}

.hero-card p,
.detail-card p,
.muted {
  color: var(--muted);
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.stat-box {
  padding: 15px;
}

.stat-box strong {
  display: block;
  margin-top: 4px;
  font-size: 1.45rem;
}

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
  gap: 14px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}

.section-title h4,
.card h4,
.preview-card h4,
.client-card h4 {
  margin: 0;
  font-size: 1rem;
}

.section-title p {
  margin: 3px 0 0;
}

.list-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--surface-alt);
  border: 1px solid #edf0ed;
  border-radius: var(--radius);
}

.badge,
.chip {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  max-width: 100%;
  padding: 4px 8px;
  border-radius: var(--radius);
  font-size: 0.78rem;
  line-height: 1.35;
}

.badge {
  background: var(--accent-soft);
  color: #9a432e;
  font-weight: 700;
}

.chip {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--muted);
}

.client-grid,
.info-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.client-card,
.preview-card,
.month-card,
.range-picker-card {
  padding: 15px;
}

.client-card p,
.preview-card p {
  margin: 7px 0;
}

.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
}

.tab-btn {
  flex: 0 0 auto;
  background: transparent;
  color: var(--muted);
}

.input-row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

input[type='text'],
input[type='time'],
input:not([type]),
select,
textarea {
  width: 100%;
  min-width: 0;
  padding: 10px 11px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface-alt);
  color: var(--text);
}

textarea {
  min-height: 92px;
  resize: vertical;
}

.field-label {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--muted);
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(92px, 1fr));
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.calendar-header-cell {
  padding: 8px 4px;
  text-align: center;
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 700;
}

.calendar-cell {
  min-height: 96px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px;
  background: var(--surface-alt);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.calendar-day-number {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.calendar-day-marks {
  display: flex;
  gap: 4px;
}

.range-dot,
.legend-dot {
  width: 9px;
  height: 9px;
  border-radius: 999px;
  display: inline-block;
}

.range-dot.planner,
.legend-dot.planner {
  background: var(--accent);
}

.range-dot.couple,
.legend-dot.couple {
  background: var(--blue);
}

.calendar-cell.active {
  background: #edf7f3;
  border-color: #b9d7cd;
}

.calendar-cell.proposal-range {
  background: #fff1ec;
  border-color: #efc4b8;
}

.calendar-cell.response-range {
  background: #edf4f7;
  border-color: #c2d7e0;
}

.calendar-cell.selection-start,
.calendar-cell.selection-end {
  box-shadow: inset 0 0 0 2px var(--primary);
}

.calendar-cell.muted-cell {
  background: transparent;
  border-style: dashed;
  box-shadow: none;
}

.calendar-event {
  border-left: 3px solid var(--primary);
  background: #fff;
  border-radius: 6px;
  padding: 6px;
  font-size: 0.76rem;
}

.calendar-event span {
  display: block;
  color: var(--muted);
  font-size: 0.72rem;
}

.year-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.month-card {
  cursor: pointer;
  box-shadow: none;
}

.mini-calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  margin-top: 8px;
  font-size: 0.72rem;
}

.mini-day {
  text-align: center;
  padding: 3px 0;
  border-radius: 6px;
  color: var(--muted);
}

.mini-day-header {
  color: var(--text);
  font-weight: 700;
}

.mini-day.has-schedule {
  background: var(--primary-soft);
  color: var(--primary-strong);
}

.coordination-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding: 12px;
  border-radius: var(--radius);
  background: var(--surface-alt);
  border: 1px solid var(--border);
}

.coordination-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.coordination-response-box,
.coordination-response-summary,
.finalize-panel {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}

.coordination-response-item {
  padding: 9px;
  border-radius: var(--radius);
  background: #fff;
  border: 1px solid var(--border);
}

.coordination-response-line,
.final-selection-item,
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(25, 34, 33, 0.48);
}

.modal-card {
  width: min(580px, 100%);
  max-height: min(86vh, 760px);
  overflow: auto;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: 0 24px 80px rgba(25, 34, 33, 0.22);
}

@media (max-width: 1100px) {
  .app-shell {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: static;
    height: auto;
    padding: 14px 16px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }

  .nav-menu {
    display: flex;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .nav-item {
    flex: 0 0 auto;
    width: auto;
  }

  .sidebar-footer {
    display: none;
  }

  .content-grid,
  .stats-grid,
  .client-grid,
  .info-grid,
  .year-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 720px) {
  .main-panel {
    padding: 18px 12px 28px;
  }

  .topbar,
  .hero-card,
  .detail-card,
  .section-title,
  .list-row,
  .coordination-row {
    align-items: stretch;
    flex-direction: column;
  }

  .topbar-actions,
  .modal-actions,
  .calendar-toolbar,
  .calendar-nav,
  .calendar-view-toggle,
  .coordination-actions,
  .input-row {
    width: 100%;
    flex-direction: column;
    align-items: stretch;
  }

  .primary-btn,
  .ghost-btn,
  .small-btn {
    width: 100%;
    white-space: normal;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
  }

  .calendar-grid {
    grid-template-columns: repeat(7, minmax(74px, 1fr));
  }

  .calendar-cell {
    min-height: 82px;
    padding: 7px;
  }

  .modal-card {
    padding: 14px;
  }
}
.availability-list,
.availability-field-list,
.availability-time-list {
  display: grid;
  gap: 8px;
  margin: 10px 0;
}

.availability-row,.availability-input-row {
  display: grid;
  grid-template-columns: minmax(120px, 1fr) minmax(120px, auto) minmax(120px, auto) auto;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
}

.availability-row strong {
  color: var(--primary-strong);
}

.availability-input-row input {
  max-width: 180px;
}

@media (max-width: 720px) {
  .availability-row,
  .availability-input-row {
    grid-template-columns: 1fr;
    align-items: stretch;
  }

  .availability-input-row input {
    max-width: none;
  }
}
.couple-proposal-list {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}

.inline-actions {
  justify-content: flex-end;
}

.availability-row.selectable {
  grid-template-columns: minmax(110px, 1fr) minmax(130px, auto) minmax(150px, auto);
}

.share-response-btn[data-state='available'],
.share-pick-planner-date[data-state='available'] {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.share-response-btn[data-state='unavailable'],
.share-pick-planner-date[data-state='unavailable'] {
  background: #fff;
  border-color: #e3b9b2;
  color: var(--danger);
}

.availability-input-row {
  grid-template-columns: minmax(120px, 1fr) minmax(120px, auto) minmax(120px, auto) auto;
}

@media (max-width: 720px) {
  .availability-row.selectable {
    grid-template-columns: 1fr;
  }
}
.calendar-color-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 10px 0 14px;
  color: var(--muted);
  font-size: 0.86rem;
}

.calendar-color-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.calendar-cell.mixed-range {
  background: linear-gradient(135deg, rgba(214, 111, 86, 0.2) 0 50%, rgba(77, 120, 145, 0.2) 50% 100%);
  border-color: #9db6bf;
}

.calendar-cell.proposal-range:not(.mixed-range) {
  box-shadow: inset 0 0 0 2px rgba(214, 111, 86, 0.24);
}

.calendar-cell.response-range:not(.mixed-range) {
  box-shadow: inset 0 0 0 2px rgba(77, 120, 145, 0.24);
}

.final-candidate-list {
  display: grid;
  gap: 8px;
}

.final-selection-item.planner {
  border-left: 4px solid var(--accent);
}

.final-selection-item.couple,
.final-selection-item.agreed {
  border-left: 4px solid var(--blue);
}

.final-kind.planner {
  background: var(--accent-soft);
  color: #9a432e;
}

.final-kind.couple {
  background: #edf4f7;
  color: var(--blue);
}

.final-kind.agreed {
  background: var(--primary-soft);
  color: var(--primary-strong);
}
.delete-response-btn {
  min-height: 32px;
  padding: 5px 9px;
  color: var(--danger);
  border-color: #e3b9b2;
}

.coordination-response-line .delete-response-btn {
  margin-left: auto;
}
.coordination-board {
  display: grid;
  gap: 14px;
}

.coordination-board-section {
  display: grid;
  gap: 10px;
}

.coordination-group {
  display: grid;
  gap: 8px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
}

.coordination-group-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.compact-title {
  margin-bottom: 4px;
}

@media (max-width: 720px) {
  .coordination-group-head {
    flex-direction: column;
  }
}
.client-group-block,
.vendor-search-card,
.vendor-result-list,
.vendor-tag-picker {
  display: grid;
  gap: 12px;
}

.client-group-block + .client-group-block {
  margin-top: 22px;
}

.compact-title {
  margin-bottom: 0;
}

.chip-button {
  border: 1px solid var(--border);
  cursor: pointer;
}

.chip-button.active {
  border-color: var(--primary);
  background: var(--primary-soft);
  color: var(--primary-strong);
}

.vendor-result-card,
.vendor-confirmed-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
}

.vendor-result-card > div,
.vendor-confirmed-row > div {
  min-width: 0;
}

.delete-vendor-btn {
  margin-top: 12px;
}

@media (max-width: 720px) {
  .vendor-result-card,
  .vendor-confirmed-row {
    align-items: stretch;
    flex-direction: column;
  }
}
.couple-info-grid {
  display: grid;
  grid-template-columns: 160px minmax(0, 1fr) 160px minmax(0, 1fr);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.couple-info-label,
.couple-info-value {
  min-width: 0;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
}

.couple-info-label {
  background: var(--surface-alt);
  font-weight: 700;
}

.couple-info-value {
  background: #fff;
  overflow-wrap: anywhere;
}

.couple-info-grid > :nth-last-child(-n + 4) {
  border-bottom: 0;
}

@media (max-width: 860px) {
  .couple-info-grid {
    grid-template-columns: 140px minmax(0, 1fr);
  }

  .couple-info-grid > :nth-last-child(-n + 4) {
    border-bottom: 1px solid var(--border);
  }

  .couple-info-grid > :nth-last-child(-n + 2) {
    border-bottom: 0;
  }
}
.timeline-month-list {
  display: grid;
  gap: 14px;
}

.timeline-month-card .list-row {
  align-items: center;
}
.contract-stack {
  display: grid;
  gap: 14px;
}

.table-scroll {
  width: 100%;
  overflow-x: auto;
}

.data-table {
  width: 100%;
  min-width: 900px;
  border-collapse: collapse;
  font-size: 0.92rem;
}

.data-table th,
.data-table td {
  border: 1px solid var(--border);
  padding: 10px 12px;
  text-align: left;
  white-space: nowrap;
}

.data-table th {
  background: var(--surface-alt);
  font-weight: 700;
}

.data-table .empty-cell {
  color: var(--muted);
  text-align: center;
}

.table-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.summary-grid.three {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.summary-grid div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 14px;
  background: var(--surface);
  border-right: 1px solid var(--border);
}

.summary-grid div:last-child {
  border-right: 0;
}

@media (max-width: 720px) {
  .summary-grid,
  .summary-grid.three {
    grid-template-columns: 1fr;
  }

  .summary-grid div {
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }

  .summary-grid div:last-child {
    border-bottom: 0;
  }
}
.calendar-detail-stack {
  display: grid;
  gap: 14px;
}

.schedule-detail-panel {
  border-color: #a9c7bd;
  background: #f7fbf9;
}

.schedule-detail-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.schedule-detail-grid > div {
  display: grid;
  gap: 4px;
}

.schedule-detail-memo {
  margin-top: 12px;
  padding-top: 12px;

const appContainer = document.getElementById('app');
const sidebarNav = document.getElementById('sidebar-nav');

let calendarMonth = new Date().getMonth();
const shareVendorFilters = {};

const navItems = [
  { id: 'dashboard', label: '대시보드' },
  { id: 'clients', label: '고객 관리' },
  { id: 'calendar', label: '캘린더' },
  { id: 'vendors', label: '업체 DB' },
  { id: 'todo', label: '할 일' },
  { id: 'settings', label: '설정' }
];
function init() {
  renderSidebar();
  bindNavigation();
  renderRoute();
}
function getRouteParts() {
  const hash = window.location.hash.replace('#', '');
  const [pathPart, queryPart] = hash.split('?');
  const parts = pathPart.split('/');
  const query = new URLSearchParams(queryPart || '');
  const section = parts[0] || 'dashboard';
  const isShareClientRoute = section === 'share' && parts[1] === 'client';
  return { section, id: isShareClientRoute ? parts[2] : parts[1], tab: isShareClientRoute ? parts[3] : parts[2], query: query.get('q') || '', category: query.get('category') || '', tag: query.get('tag') || '', scheduleId: query.get('schedule') || '' };
}
function renderSidebar() {
  const currentSection = getRouteParts().section;
  sidebarNav.innerHTML = navItems.map((item) => `<button class="nav-item ${item.id === currentSection ? 'active' : ''}" data-route="${item.id}">${item.label}</button>`).join('');
}
function bindNavigation() {
  window.addEventListener('hashchange', renderRoute);
  sidebarNav.addEventListener('click', (event) => {
    const button = event.target.closest('[data-route]');
    if (button) window.location.hash = `#${button.dataset.route}`;
  });
}
function renderRoute() {
  const { section, id, tab, scheduleId } = getRouteParts();
  renderSidebar();
  pageTitle.textContent = getTitle(section, id);
  if (section === 'clients' && id) return renderClientDetail(id, tab || 'overview', scheduleId);
  if (section === 'share' && id) return renderSharePreview(id);
  if (section === 'clients') return renderClients();
  if (section === 'calendar') return renderCalendar();
  if (section === 'vendors') return renderVendors();
  if (section === 'todo') return renderTodo();
  if (section === 'settings') return renderSettings();
  renderDashboard();
}
function getTitle(section, id) {
  const titles = { dashboard: '대시보드', clients: '고객 목록', calendar: '전체 캘린더', vendors: '업체 DB', todo: '오늘의 To-do', settings: '설정' };
  if (section === 'clients' && id) {
    const client = getClient(id);
    return client ? `${client.brideName} ♥ ${client.groomName}` : '고객 상세';
  }
  if (section === 'share') return '고객 공유 페이지 미리보기';
  return titles[section] || '대시보드';
}
function getClient(id) { return mockData.clients.find((client) => client.id === Number(id)); }
function closeModal() { modalRoot.innerHTML = ''; }
function getDDay(targetDate) {
  const today = new Date(new Date().toDateString());
  const diff = Math.ceil((new Date(targetDate) - today) / (1000 * 60 * 60 * 24));
  return diff >= 0 ? `D-${diff}` : `D+${Math.abs(diff)}`;
}
function getTimeRangeLabel(startTime, endTime) {
  if (!startTime && !endTime) return '하루 종일';
  if (startTime && endTime) return `${startTime}~${endTime}`;
  return startTime || endTime;
}
function isClientFinished(client) {
  const statusText = `${client.status || ''} ${client.progressStage || ''}`;
  if (/종료|완료|마감/.test(statusText)) return true;
  return client.weddingDate && new Date(client.weddingDate) < new Date(new Date().toDateString());
}
function renderTodoRow(todo) {
  const client = getClient(todo.clientGroupId);
  return `<div class="list-row"><div><strong>${todo.title}</strong><div class="muted">${client?.brideName || '고객'} · ${todo.category || '일반'}${todo.dueDate ? ` · ${todo.dueDate}` : ''}</div></div><input class="dashboard-todo-check" data-todo-id="${todo.id}" type="checkbox" ${todo.completed ? 'checked' : ''} /></div>`;
}
function renderScheduleRow(schedule) {
  const client = getClient(schedule.clientGroupId);
  return `<div class="list-row"><div><strong>${new Date(schedule.startDateTime).toLocaleString('ko-KR')}</strong><div class="muted">${client?.brideName || '고객'} · ${schedule.title}</div></div><span class="badge">${schedule.status || schedule.type}</span></div>`;
}
function renderDashboardTodoForm() {
  return `<div class="todo-action-panel"><div><strong>할 일 관리</strong><p class="muted">새 할 일은 별도 입력창에서 등록합니다.</p></div><button class="primary-btn" id="open-dashboard-todo-modal" type="button">+ 할 일 추가</button></div>`;
}
function openDashboardTodoModal() {
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  modalRoot.innerHTML = `<div class="modal-backdrop"><div class="modal-card"><div class="section-title"><h4>TODO 입력창</h4><button class="ghost-btn" id="close-todo-modal" type="button">닫기</button></div><form id="dashboard-todo-form" class="form-stack"><label class="field-label">고객<select id="dashboard-todo-client">${mockData.clients.map((client) => `<option value="${client.id}">${client.brideName} ♥ ${client.groomName}</option>`).join('')}</select></label><label class="field-label">할 일<input id="dashboard-todo-title" type="text" placeholder="예: 계약서 사본 확인" required /></label><div class="input-row"><label class="field-label">마감일<input id="dashboard-todo-date" type="date" value="${today}" /></label><label class="field-label">분류<input id="dashboard-todo-category" type="text" placeholder="상담, 계약, 일정" value="일정" /></label></div><div class="modal-actions"><button class="ghost-btn" type="button" id="cancel-todo-modal">취소</button><button class="primary-btn" type="submit">추가</button></div></form></div></div>`;
  document.getElementById('close-todo-modal')?.addEventListener('click', closeModal);
  document.getElementById('cancel-todo-modal')?.addEventListener('click', closeModal);
  document.getElementById('dashboard-todo-form')?.addEventListener('submit', (event) => {
    event.preventDefault();
    const title = document.getElementById('dashboard-todo-title').value.trim();
    if (!title) return;
    const clientId = Number(document.getElementById('dashboard-todo-client').value);
    mockData.todos.push({ id: getNextId(mockData.todos), clientGroupId: clientId, title, dueDate: document.getElementById('dashboard-todo-date').value, priority: '', completed: false, category: document.getElementById('dashboard-todo-category').value.trim() || '일정' });
    const client = getClient(clientId);

  });
}
function bindDashboardTodoControls() {
  document.getElementById('open-dashboard-todo-modal')?.addEventListener('click', openDashboardTodoModal);
  document.querySelectorAll('.dashboard-todo-check').forEach((checkbox) => checkbox.addEventListener('change', () => {
    const todo = mockData.todos.find((item) => item.id === Number(checkbox.dataset.todoId));

  }));
}

function generateClientTagsFromConsultation(text) {
  const source = text || '';
  const rules = [
    ['#실크', /실크|깔끔|미니멀/],
    ['#클래식', /클래식|고급|단정/],
    ['#로맨틱', /로맨틱|러블리|꽃|플라워/],
    ['#내추럴', /내추럴|자연|야외|채광/],
    ['#화려함', /화려|비즈|반짝|글리터/],
    ['#모던', /모던|심플|도시/],
    ['#예산중시', /예산|비용|가격|금액/],
    ['#일정중시', /일정|날짜|시간|빠른|마감/]

}

  const buildVendorHash = () => buildVendorDbHash(document.getElementById('vendor-db-search')?.value.trim() || '', document.getElementById('vendor-db-category')?.value || '', activeTag);
  appContainer.innerHTML = `<div class="page-grid"><section class="card"><div class="section-title"><div><h4>업체 DB</h4><p class="muted">카테고리와 태그를 눌러 조건을 좁히고, 검색어로 업체를 찾습니다.</p></div><button class="small-btn" id="open-vendor-modal" type="button">+ 업체 추가</button></div><div class="vendor-search-summary"><strong>${filteredVendors.length}</strong><span> / ${mockData.vendors.length}개 업체 표시</span>${activeCategory ? `<span class="chip">${activeCategory}</span>` : ''}${activeTag ? `<span class="chip">${activeTag}</span>` : ''}</div><div class="vendor-search-layout"><aside class="vendor-filter-panel"><h4>카테고리</h4>${categoryOptions}<h4>태그</h4>${tagOptions}</aside><div class="vendor-search-results"><div class="vendor-db-filter"><input id="vendor-db-search" type="text" value="${query}" placeholder="업체명, 인스타, 태그 검색" /><select id="vendor-db-category"><option value="">전체 카테고리</option>${vendorCategories.map((item) => `<option value="${item}" ${item === activeCategory ? 'selected' : ''}>${item}</option>`).join('')}</select><button class="small-btn" id="vendor-db-search-btn" type="button">검색</button></div><div class="client-grid">${filteredVendors.length ? filteredVendors.map((vendor) => `<article class="client-card"><div class="section-title compact-title"><div><h4>${vendor.name}</h4><p class="muted">${vendor.category}</p></div><span class="badge">${vendor.styleTags?.length || 0} tags</span></div><p>가격대 · ${vendor.priceRange || '공란'}</p><p>연락처 · ${vendor.contact || '미입력'}</p><p>인스타 · ${vendor.instagram || '미입력'}</p><p>주소 · ${vendor.address || '미입력'}</p><p>최근 연락일 · ${vendor.lastContact || '미입력'}</p><div class="client-meta">${(vendor.styleTags || []).map((tag) => `<span class="chip">${tag}</span>`).join('')}</div><div class="table-actions vendor-card-actions"><button class="small-btn edit-vendor-btn" data-vendor-id="${vendor.id}" type="button">정보 수정</button><button class="ghost-btn delete-vendor-btn" data-vendor-id="${vendor.id}" type="button">업체 삭제</button></div></article>`).join('') : '<p class="muted">조건에 맞는 업체가 없습니다.</p>'}</div></div></div></section></div>`;
  document.getElementById('open-vendor-modal')?.addEventListener('click', () => openVendorModal());
  document.getElementById('vendor-db-search-btn')?.addEventListener('click', () => { window.location.hash = buildVendorHash(); });

  document.getElementById('vendor-db-category')?.addEventListener('change', () => { window.location.hash = buildVendorHash(); });

  document.querySelectorAll('.delete-vendor-btn').forEach((button) => button.addEventListener('click', () => deleteVendor(button.dataset.vendorId)));
}function getVendorCategories() { return vendorCategories; }
function getShareVendorFilter(clientId) {
  const key = String(clientId);
  const categories = getVendorCategories();
  if (!shareVendorFilters[key]) shareVendorFilters[key] = { category: categories[0] || '', tags: [], search: '' };
  if (!categories.includes(shareVendorFilters[key].category)) { shareVendorFilters[key].category = categories[0] || ''; shareVendorFilters[key].tags = []; }
  return shareVendorFilters[key];
}
function getVendorTagsForCategory(category) { return [...new Set(mockData.vendors.filter((vendor) => vendor.category === category).flatMap((vendor) => vendor.styleTags || []))]; }
function getFilteredShareVendors(clientId) {
  const filter = getShareVendorFilter(clientId);
  return mockData.vendors.filter((vendor) => {
    if (filter.category && vendor.category !== filter.category) return false;
    const keyword = filter.search.trim().toLowerCase();
    const text = `${vendor.name} ${vendor.category} ${vendor.instagram || ''} ${vendor.memo || ''} ${vendor.styleTags.join(' ')}`.toLowerCase();
    if (keyword && !text.includes(keyword)) return false;
    return !filter.tags.length || filter.tags.every((tag) => vendor.styleTags.includes(tag));
  });
}
function renderContractedVendorList(clientId, allowDelete = true) {
  const contracts = mockData.contracts.filter((contract) => contract.clientGroupId === Number(clientId));
  if (!contracts.length) return '<p class="muted">아직 확정된 업체가 없습니다.</p>';
  return contracts.map((contract) => {
    const vendor = mockData.vendors.find((entry) => entry.id === contract.vendorId);
    return `<div class="vendor-confirmed-row"><div><strong>${vendor?.name || '삭제된 업체'}</strong><p class="muted">${vendor?.category || '업종 미정'} · ${contract.packageDetails || '확정 업체'}</p></div>${allowDelete ? `<button class="ghost-btn delete-contracted-vendor" data-contract-id="${contract.id}" type="button">삭제</button>` : ''}</div>`;
  }).join('');
}
function renderShareVendorExplorer(client) {
  const filter = getShareVendorFilter(client.id);

  const vendors = getFilteredShareVendors(client.id);
  const contractedVendorIds = mockData.contracts.filter((contract) => contract.clientGroupId === client.id).map((contract) => contract.vendorId);

}
function addContractedVendor(clientId, vendorId) {
  if (mockData.contracts.some((contract) => contract.clientGroupId === Number(clientId) && contract.vendorId === Number(vendorId))) return;
  mockData.contracts.push({ id: Date.now(), clientGroupId: Number(clientId), vendorId: Number(vendorId), contractDate: new Date().toISOString().slice(0, 10), totalPrice: 0, deposit: 0, paymentMethod: '미입력', vatIncluded: false, packageDetails: '플래너가 고객관리에서 확정', additionalCost: 0, memo: '고객관리 업체 검색에서 추가됨', contractFile: '' });
}
function deleteContractedVendor(contractId) { mockData.contracts = mockData.contracts.filter((contract) => contract.id !== Number(contractId)); }
function bindShareVendorControls(clientId) {
  const applySearch = () => { getShareVendorFilter(clientId).search = document.getElementById('share-vendor-search')?.value || ''; renderRoute(); };
  document.getElementById('share-vendor-search-btn')?.addEventListener('click', applySearch);
  document.getElementById('share-vendor-search')?.addEventListener('keydown', (event) => { if (event.key === 'Enter') applySearch(); });
  document.getElementById('share-vendor-category')?.addEventListener('change', (event) => { const filter = getShareVendorFilter(clientId); filter.category = event.target.value; filter.tags = []; renderRoute(); });
  document.querySelectorAll('.share-vendor-tag').forEach((button) => button.addEventListener('click', () => { const filter = getShareVendorFilter(clientId); const tag = button.dataset.tag; filter.tags = filter.tags.includes(tag) ? filter.tags.filter((item) => item !== tag) : [...filter.tags, tag]; renderRoute(); }));
  document.querySelectorAll('.confirm-share-vendor').forEach((button) => button.addEventListener('click', () => { addContractedVendor(button.dataset.clientId, button.dataset.vendorId); renderRoute(); }));
  document.querySelectorAll('.delete-contracted-vendor').forEach((button) => button.addEventListener('click', () => { deleteContractedVendor(button.dataset.contractId); renderRoute(); }));
}
function openCoupleProposalModal(optionId) {

  if (!option) return;
  modalRoot.innerHTML = `<div class="modal-backdrop"><div class="modal-card"><div class="section-title"><h4>다른 일정 제안</h4><button class="ghost-btn" id="close-couple-proposal-modal" type="button">닫기</button></div><form id="couple-proposal-form" class="form-stack"><p class="muted">플래너가 제안한 일정 외에도 원하는 날짜와 시간을 제안할 수 있습니다. 시간을 비우면 하루 종일로 저장됩니다.</p><label class="field-label">날짜</label><input id="couple-proposal-date" type="date" required /><div class="input-row"><label class="field-label">시작 시간<input id="couple-proposal-start-time" type="time" /></label><label class="field-label">종료 시간<input id="couple-proposal-end-time" type="time" /></label></div><label class="field-label">메모</label><input id="couple-proposal-reason" type="text" placeholder="요청 메모" /><div class="modal-actions"><button class="ghost-btn" type="button" id="cancel-couple-proposal-modal">취소</button><button class="primary-btn" type="submit">일정 제안</button></div></form></div></div>`;
  document.getElementById('close-couple-proposal-modal')?.addEventListener('click', closeModal);
  document.getElementById('cancel-couple-proposal-modal')?.addEventListener('click', closeModal);
  document.getElementById('couple-proposal-form')?.addEventListener('submit', (event) => {

    closeModal();

}
function renderSharePreview(clientId) {
